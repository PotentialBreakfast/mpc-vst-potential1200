text cx=84 cy=376 label="LEVEL: each pad's volume. All the way down is off." size=1.45 weight=600 case=none align=left color=b3ad9e when=manual_page:1
text cx=62 cy=408 label="-" size=1.45 weight=700 case=none align=left color=f4efe0 when=manual_page:1
text cx=84 cy=408 label="FILTER: the cutoff of a DYNAMIC pad. Pads 1-2 are DYNAMIC, 3-6 FIXED and 7-8 OFF to start with." size=1.45 weight=600 case=none align=left color=b3ad9e when=manual_page:1
text cx=60 cy=440 label="Tap a pad below the faders to hear it and select it. PROGRAM shows the selected pad." size=1.45 weight=600 case=none align=left color=b3ad9e when=manual_page:1
text cx=60 cy=240 label="WHERE THE SOUNDS COME FROM" size=1.9 weight=700 align=left color=f4efe0 when=manual_page:2
text cx=60 cy=280 label="ONE-SHOTS: a DRUM ONE SHOTS folder on any drive (MPC TOOLS makes one with MAKE DRUM FOLDER), or the folders" size=1.45 weight=600 case=none align=left color=b3ad9e when=manual_page:2
text cx=60 cy=312 label="listed in Potential1200/folders.txt, else the drum sounds in your Expansions and Samples." size=1.45 weight=600 case=none align=left color=b3ad9e when=manual_page:2
text cx=62 cy=344 label="-" size=1.45 weight=700 case=none align=left color=f4efe0 when=manual_page:2
text cx=84 cy=344 label="Each pad has a type (KICK, SNARE, HAT ...). Its arrows step through that type. L locks the pad." size=1.45 weight=600 case=none align=left color=b3ad9e when=manual_page:2
text cx=62 cy=376 label="-" size=1.45 weight=700 case=none align=left color=f4efe0 when=manual_page:2
text cx=84 cy=376 label="NEW KIT: new sounds on every unlocked pad. ROLL: MILD, MEDIUM or WILD changes to sounds and settings." size=1.45 weight=600 case=none align=left color=b3ad9e when=manual_page:2
text cx=60 cy=408 label="BREAK: 2 bars of a break from your DRUM BREAKS LIBRARY, from a kick on the 1, cut into 8 on the beat or on the" size=1.45 weight=600 case=none align=left color=b3ad9e when=manual_page:2
text cx=60 cy=440 label="hits." size=1.45 weight=600 case=none align=left color=b3ad9e when=manual_page:2
text cx=62 cy=472 label="-" size=1.45 weight=700 case=none align=left color=f4efe0 when=manual_page:2
text cx=84 cy=472 label="TEMPO: AS IS, MATCH (TUNE) the old way (faster is higher), or MATCH (STRETCH) to keep the pitch." size=1.45 weight=600 case=none align=left color=b3ad9e when=manual_page:2
text cx=60 cy=240 label="SOUND AND SAVING" size=1.9 weight=700 align=left color=f4efe0 when=manual_page:3
text cx=62 cy=280 label="-" size=1.45 weight=700 case=none align=left color=f4efe0 when=manual_page:3
text cx=84 cy=280 label="SAMPLE SPEED 45 > 33: the old record trick. The sound is taken fast and slowed back, darker and crunchier." size=1.45 weight=600 case=none align=left color=b3ad9e when=manual_page:3
text cx=62 cy=312 label="-" size=1.45 weight=700 case=none align=left color=f4efe0 when=manual_page:3
text cx=84 cy=312 label="CHARACTER CLEAN: no 12-bit or 26 kHz, to hear the difference." size=1.45 weight=600 case=none align=left color=b3ad9e when=manual_page:3
text cx=62 cy=344 label="-" size=1.45 weight=700 case=none align=left color=f4efe0 when=manual_page:3
text cx=84 cy=344 label="PADS 9-16: MULTI PITCH plays the selected pad at 0 2 3 5 7 8 10 12 semitones, or OFF." size=1.45 weight=600 case=none align=left color=b3ad9e when=manual_page:3
text cx=62 cy=376 label="-" size=1.45 weight=700 case=none align=left color=f4efe0 when=manual_page:3
text cx=84 cy=376 label="SAVE KIT: the 8 pads as you hear them, as an MPC drum program in Potential1200/Kits." size=1.45 weight=600 case=none align=left color=b3ad9e when=manual_page:3
text cx=62 cy=408 label="-" size=1.45 weight=700 case=none align=left color=f4efe0 when=manual_page:3
text cx=84 cy=408 label="PROGRAM: STRETCH keeps a pad's length when you tune it. START and END trim it. CHOKE groups cut each other." size=1.45 weight=600 case=none align=left color=b3ad9e when=manual_page:3
text cx=60 cy=240 label="IF SOMETHING IS MISSING" size=1.9 weight=700 align=left color=f4efe0 when=manual_page:4
text cx=62 cy=280 label="-" size=1.45 weight=700 case=none align=left color=f4efe0 when=manual_page:4
text cx=84 cy=280 label="No one-shots: make a drum folder in MPC TOOLS (Plugins tab), then tap RESCAN on SETUP." size=1.45 weight=600 case=none align=left color=b3ad9e when=manual_page:4
text cx=62 cy=312 label="-" size=1.45 weight=700 case=none align=left color=f4efe0 when=manual_page:4
text cx=84 cy=312 label="No breaks: a folder called DRUM BREAKS LIBRARY at the top of a drive, then RESCAN." size=1.45 weight=600 case=none align=left color=b3ad9e when=manual_page:4
text cx=62 cy=344 label="-" size=1.45 weight=700 case=none align=left color=f4efe0 when=manual_page:4
text cx=84 cy=344 label="A sound that will not load shows CAN'T READ on the status line. WAV, AIFF, FLAC and MP3 work." size=1.45 weight=600 case=none align=left color=b3ad9e when=manual_page:4
text cx=62 cy=376 label="-" size=1.45 weight=700 case=none align=left color=f4efe0 when=manual_page:4
text cx=84 cy=376 label="The mix is mono, like the old machines. Each pad plays one sound at a time." size=1.45 weight=600 case=none align=left color=b3ad9e when=manual_page:4
text cx=60 cy=408 label="Potential1200 is part of the PotentialSuite. Ideas and fixes are welcome on GitHub." size=1.45 weight=600 case=none align=left color=b3ad9e when=manual_page:4
