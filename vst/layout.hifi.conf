text cx=60 cy=240 label="A 12-BIT SAMPLER, THE LATE-80S WAY" size=1.9 weight=700 align=left color=f4efe0 when=manual_page:0
text cx=60 cy=280 label="Every sound is sampled at 26 kHz with no filter in front (the highs fold back as grit) and kept as 12 bits." size=1.45 weight=600 case=none align=left color=b3ad9e when=manual_page:0
text cx=60 cy=312 label="Pitch works the old way: a higher pitch plays faster and shorter, a lower one slower and longer." size=1.45 weight=600 case=none align=left color=b3ad9e when=manual_page:0
