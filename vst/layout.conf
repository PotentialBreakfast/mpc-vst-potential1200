[tab MANUAL]
art file=skin/looks/_bg_vintage.svg
frame x=14 y=100 w=1252 h=604 title="MANUAL"
enum_h cx=640 cy=166 label="" key=manual_page sw=190 sh=56 rows=1
text cx=60 cy=240 label="A 12-BIT SAMPLER, THE LATE-80S WAY" size=1.9 weight=700 align=left color=2a2723 when=manual_page:0
text cx=60 cy=280 label="Every sound is sampled at 26 kHz with no filter in front (the highs fold back as grit) and kept as 12 bits." size=1.45 weight=600 case=none align=left color=3a352e when=manual_page:0
text cx=60 cy=312 label="Pitch works the old way: a higher pitch plays faster and shorter, a lower one slower and longer." size=1.45 weight=600 case=none align=left color=3a352e when=manual_page:0
text cx=62 cy=344 label="-" size=1.45 weight=700 case=none align=left color=2a2723 when=manual_page:0
text cx=84 cy=344 label="Play pads 1-8 (A01-A08). Pads 9-16 play the selected pad at 8 pitches (MULTI PITCH)." size=1.45 weight=600 case=none align=left color=3a352e when=manual_page:0
text cx=62 cy=376 label="-" size=1.45 weight=700 case=none align=left color=2a2723 when=manual_page:0
text cx=84 cy=376 label="PERFORM: 8 faders for the 8 pads. TUNE, DECAY, LEVEL or FILTER picks what they move." size=1.45 weight=600 case=none align=left color=3a352e when=manual_page:0
text cx=62 cy=408 label="-" size=1.45 weight=700 case=none align=left color=2a2723 when=manual_page:0
text cx=84 cy=408 label="KIT: where the sounds come from. ONE-SHOTS from your folders, or a BREAK chopped across the pads." size=1.45 weight=600 case=none align=left color=3a352e when=manual_page:0
text cx=62 cy=440 label="-" size=1.45 weight=700 case=none align=left color=2a2723 when=manual_page:0
text cx=84 cy=440 label="Start: open KIT and tap NEW KIT or ROLL. Then play." size=1.45 weight=600 case=none align=left color=3a352e when=manual_page:0
text cx=60 cy=240 label="THE FADERS" size=1.9 weight=700 align=left color=2a2723 when=manual_page:1
text cx=60 cy=280 label="Tap TUNE, DECAY, LEVEL or FILTER: the faders jump to that setting of each pad." size=1.45 weight=600 case=none align=left color=3a352e when=manual_page:1
text cx=62 cy=312 label="-" size=1.45 weight=700 case=none align=left color=2a2723 when=manual_page:1
text cx=84 cy=312 label="TUNE: -12 to +12 semitones. Pitch changes the length too, as on the old machines." size=1.45 weight=600 case=none align=left color=3a352e when=manual_page:1
text cx=62 cy=344 label="-" size=1.45 weight=700 case=none align=left color=2a2723 when=manual_page:1
text cx=84 cy=344 label="DECAY: shortens the tail. FULL lets the whole sound play." size=1.45 weight=600 case=none align=left color=3a352e when=manual_page:1
text cx=62 cy=376 label="-" size=1.45 weight=700 case=none align=left color=2a2723 when=manual_page:1
text cx=84 cy=376 label="LEVEL: each pad's volume. All the way down is off." size=1.45 weight=600 case=none align=left color=3a352e when=manual_page:1
text cx=62 cy=408 label="-" size=1.45 weight=700 case=none align=left color=2a2723 when=manual_page:1
text cx=84 cy=408 label="FILTER: the cutoff of a DYNAMIC pad. Pads 1-2 are DYNAMIC, 3-6 FIXED and 7-8 OFF to start with." size=1.45 weight=600 case=none align=left color=3a352e when=manual_page:1
text cx=60 cy=440 label="Tap a pad below the faders to hear it and select it. PROGRAM shows the selected pad." size=1.45 weight=600 case=none align=left color=3a352e when=manual_page:1
text cx=60 cy=240 label="WHERE THE SOUNDS COME FROM" size=1.9 weight=700 align=left color=2a2723 when=manual_page:2
text cx=60 cy=280 label="ONE-SHOTS: a DRUM ONE SHOTS folder on any drive (MPC TOOLS makes one with MAKE DRUM FOLDER), or the folders" size=1.45 weight=600 case=none align=left color=3a352e when=manual_page:2
text cx=60 cy=312 label="listed in Potential1200/folders.txt, else the drum sounds in your Expansions and Samples." size=1.45 weight=600 case=none align=left color=3a352e when=manual_page:2
text cx=62 cy=344 label="-" size=1.45 weight=700 case=none align=left color=2a2723 when=manual_page:2
text cx=84 cy=344 label="Each pad has a type (KICK, SNARE, HAT ...). Its arrows step through that type. L locks the pad." size=1.45 weight=600 case=none align=left color=3a352e when=manual_page:2
text cx=62 cy=376 label="-" size=1.45 weight=700 case=none align=left color=2a2723 when=manual_page:2
text cx=84 cy=376 label="NEW KIT: new sounds on every unlocked pad. ROLL: MILD, MEDIUM or WILD changes to sounds and settings." size=1.45 weight=600 case=none align=left color=3a352e when=manual_page:2
text cx=60 cy=408 label="BREAK: a break from your DRUM BREAKS LIBRARY, cut into 8 on the beat or on the hits." size=1.45 weight=600 case=none align=left color=3a352e when=manual_page:2
text cx=62 cy=440 label="-" size=1.45 weight=700 case=none align=left color=2a2723 when=manual_page:2
text cx=84 cy=440 label="TEMPO: AS IS, MATCH (TUNE) the old way (faster is higher), or MATCH (STRETCH) to keep the pitch." size=1.45 weight=600 case=none align=left color=3a352e when=manual_page:2
text cx=60 cy=240 label="SOUND AND SAVING" size=1.9 weight=700 align=left color=2a2723 when=manual_page:3
text cx=62 cy=280 label="-" size=1.45 weight=700 case=none align=left color=2a2723 when=manual_page:3
text cx=84 cy=280 label="SAMPLE SPEED 45 > 33: the old record trick. The sound is taken fast and slowed back, darker and crunchier." size=1.45 weight=600 case=none align=left color=3a352e when=manual_page:3
text cx=62 cy=312 label="-" size=1.45 weight=700 case=none align=left color=2a2723 when=manual_page:3
text cx=84 cy=312 label="CHARACTER CLEAN: no 12-bit or 26 kHz, to hear the difference." size=1.45 weight=600 case=none align=left color=3a352e when=manual_page:3
text cx=62 cy=344 label="-" size=1.45 weight=700 case=none align=left color=2a2723 when=manual_page:3
text cx=84 cy=344 label="PADS 9-16: MULTI PITCH plays the selected pad at 0 2 3 5 7 8 10 12 semitones, or OFF." size=1.45 weight=600 case=none align=left color=3a352e when=manual_page:3
text cx=62 cy=376 label="-" size=1.45 weight=700 case=none align=left color=2a2723 when=manual_page:3
text cx=84 cy=376 label="SAVE KIT: the 8 pads as you hear them, as an MPC drum program in Potential1200/Kits." size=1.45 weight=600 case=none align=left color=3a352e when=manual_page:3
text cx=62 cy=408 label="-" size=1.45 weight=700 case=none align=left color=2a2723 when=manual_page:3
text cx=84 cy=408 label="PROGRAM: STRETCH keeps a pad's length when you tune it. START and END trim it. CHOKE groups cut each other." size=1.45 weight=600 case=none align=left color=3a352e when=manual_page:3
text cx=60 cy=240 label="IF SOMETHING IS MISSING" size=1.9 weight=700 align=left color=2a2723 when=manual_page:4
text cx=62 cy=280 label="-" size=1.45 weight=700 case=none align=left color=2a2723 when=manual_page:4
text cx=84 cy=280 label="No one-shots: make a drum folder in MPC TOOLS (Plugins tab), then tap RESCAN on SETUP." size=1.45 weight=600 case=none align=left color=3a352e when=manual_page:4
text cx=62 cy=312 label="-" size=1.45 weight=700 case=none align=left color=2a2723 when=manual_page:4
text cx=84 cy=312 label="No breaks: a folder called DRUM BREAKS LIBRARY at the top of a drive, then RESCAN." size=1.45 weight=600 case=none align=left color=3a352e when=manual_page:4
text cx=62 cy=344 label="-" size=1.45 weight=700 case=none align=left color=2a2723 when=manual_page:4
text cx=84 cy=344 label="A sound that will not load shows CAN'T READ on the status line. WAV, AIFF, FLAC and MP3 work." size=1.45 weight=600 case=none align=left color=3a352e when=manual_page:4
text cx=62 cy=376 label="-" size=1.45 weight=700 case=none align=left color=2a2723 when=manual_page:4
text cx=84 cy=376 label="The mix is mono, like the old machines. Each pad plays one sound at a time." size=1.45 weight=600 case=none align=left color=3a352e when=manual_page:4
text cx=60 cy=408 label="Potential1200 is part of the PotentialSuite. Ideas and fixes are welcome on GitHub." size=1.45 weight=600 case=none align=left color=3a352e when=manual_page:4
qlinks "MANUAL" = -
